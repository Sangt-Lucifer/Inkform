<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f5f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="INKFORM" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="" data-t-content="meta.description" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; worker-src 'self'; manifest-src 'self'; frame-src blob:; form-action 'none'; base-uri 'none'"
    />
    <link rel="icon" type="image/png" href="__STUDIO_LOGO__" />
    <title data-t="meta.title"></title>
    <script src="../public/vendor/tailwind-browser.js"></script>
    <script defer src="../public/vendor/jspdf.umd.min.js" id="pdf-library"></script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <svg
      xmlns="http://www.w3.org/2000/svg"
      style="position: absolute; width: 0; height: 0; overflow: hidden"
      aria-hidden="true"
    >
      <symbol id="i-lock" viewBox="0 0 24 24">
        <rect x="5" y="10" width="14" height="11" rx="2" />
        <path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2" />
      </symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6" /></symbol>
      <symbol id="i-doc" viewBox="0 0 24 24">
        <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z" />
        <path d="M14 3v6h6M8 13h8m-8 4h5" />
      </symbol>
      <symbol id="i-pen" viewBox="0 0 24 24">
        <path d="m15 4 5 5M4 20l5-1L20 8a2.1 2.1 0 0 0-5-5L4 14ZM4 14l5 5M3 22h18" />
      </symbol>
      <symbol id="i-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 7v5l3 2" />
      </symbol>
      <symbol id="i-info" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 11v6m0-10v.1" />
      </symbol>
      <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 10a9 9 0 1 1 1 7M3 4v6h6" /></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24">
        <path d="M4 7h16M4 17h16" />
        <circle cx="9" cy="7" r="3" fill="var(--paper)" />
        <circle cx="15" cy="17" r="3" fill="var(--paper)" />
      </symbol>
      <symbol id="i-warning" viewBox="0 0 24 24"><path d="m12 3 10 18H2ZM12 9v5m0 3v.1" /></symbol>
      <symbol id="i-share" viewBox="0 0 24 24">
        <path d="M12 16V3m-5 5 5-5 5 5M5 12H3v9h18v-9h-2" />
      </symbol>
      <symbol id="i-download" viewBox="0 0 24 24">
        <path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5" />
      </symbol>
      <symbol id="i-grid" viewBox="0 0 24 24">
        <rect x="3" y="3" width="7" height="7" rx="1.5" />
        <rect x="14" y="3" width="7" height="7" rx="1.5" />
        <rect x="3" y="14" width="7" height="7" rx="1.5" />
        <rect x="14" y="14" width="7" height="7" rx="1.5" />
      </symbol>
      <symbol id="i-building" viewBox="0 0 24 24">
        <rect x="5" y="3" width="14" height="18" rx="2" />
        <path d="M9 7h.1m5.9 0h.1M9 11h.1m5.9 0h.1M10 21v-6h4v6" />
      </symbol>
      <symbol id="i-heart" viewBox="0 0 24 24">
        <path d="M20 5c-3-3-6-1-8 1-2-2-5-4-8-1-4 4 0 9 8 15 8-6 12-11 8-15Z" />
        <path d="M5 12h4l2-4 2 8 2-4h4" />
      </symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24">
        <path d="M4 7h16M4 17h16" />
        <circle cx="9" cy="7" r="3" fill="var(--ad-sidebar)" />
        <circle cx="15" cy="17" r="3" fill="var(--ad-sidebar)" />
      </symbol>
      <symbol id="i-sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5" />
      </symbol>
      <symbol id="i-moon" viewBox="0 0 24 24">
        <path d="M21 13a9 9 0 0 1-10-10A9 9 0 1 0 21 13Z" />
      </symbol>
      <symbol id="i-external" viewBox="0 0 24 24">
        <path d="M14 3h7v7m0-7-12 12m1-12H3v18h18v-7" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7" /></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" /></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16" /></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24">
        <path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7" />
      </symbol>
      <symbol id="i-upload" viewBox="0 0 24 24">
        <path d="M12 16V3m-5 5 5-5 5 5M4 16v5h16v-5" />
      </symbol>
      <symbol id="i-tablet" viewBox="0 0 24 24">
        <rect x="4" y="2" width="16" height="20" rx="2" />
        <path d="M11 18h2" />
      </symbol>
    </svg>
    <noscript
      >Bitte aktiviere JavaScript, um das Formular auszufüllen, zu unterschreiben und als PDF zu
      speichern.</noscript
    >
    <section
      id="completion-screen"
      class="completion-screen"
      hidden
      aria-labelledby="completion-title"
    >
      <div>
        <h1 id="completion-title" tabindex="-1" data-t="completion.title"></h1>
        <p id="completion-copy" data-t="completion.copy"></p>
        <button type="button" id="completion-unlock" data-t="completion.unlock"></button>
      </div>
    </section>
    <section id="install-screen" class="install-screen" hidden aria-labelledby="install-screen-title"></section>
    <div id="customer-app">
      <header class="topbar">
        <div class="shell topbar-inner">
          <a href="#start" class="wordmark" data-t-aria-label="customer.wordmark">
            <img
              class="studio-logo"
              src="__STUDIO_LOGO__"
              alt="%%logoAlt%%"
              width="72"
              height="72"
            />
            <span class="brand-copy"
              ><strong id="customer-brand">INKFORM</strong
              ><small id="customer-studio-name">%%customerStudioName%%</small></span
            ></a
          >
          <div class="top-actions">
            <div id="customer-language" class="language-choice" role="group" data-t-aria-label="customer.language" hidden></div>
            <button
              type="button"
              class="theme-button"
              data-theme-toggle
              data-t-aria-label="common.themeToggle"
            ></button>
            <button
              type="button"
              class="text-button"
              id="studio-open"
              data-t-aria-label="customer.adminOpen"
            >
              <svg class="icon" aria-hidden="true"><use href="#i-settings" /></svg
              ><span id="studio-button-label" data-t="customer.admin"></span>
            </button>
          </div>
        </div>
      </header>
      <div class="shell layout" id="start">
        <aside class="sidebar" data-t-aria-label="side.label">
          <div class="eyebrow" data-t="side.eyebrow"></div>
          <h2 class="side-title" data-t="side.title"></h2>
          <p class="side-copy" data-t="side.copy"></p>
          <nav data-t-aria-label="side.steps">
            <ol class="steps">
              <li>
                <a class="step-link" href="#personal" data-step="personal" aria-current="step"
                  ><span class="step-number">01</span
                  ><span class="step-name"
                    data-t="side.step.personal"><span class="step-note" data-t="side.step.personalNote"></span></span
                  ></a
                >
              </li>
              <li>
                <a class="step-link" href="#health" data-step="health"
                  ><span class="step-number">02</span
                  ><span class="step-name"
                    data-t="side.step.health"><span class="step-note" data-t="side.step.healthNote"></span></span
                  ></a
                >
              </li>
              <li>
                <a class="step-link" href="#consent" data-step="consent"
                  ><span class="step-number">03</span
                  ><span class="step-name"
                    data-t="side.step.consent"><span class="step-note" data-t="side.step.consentNote"></span></span
                  ></a
                >
              </li>
              <li>
                <a class="step-link" href="#signature" data-step="signature"
                  ><span class="step-number">04</span
                  ><span class="step-name"
                    data-t="side.step.signature"><span class="step-note" data-t="side.step.signatureNote"></span></span
                  ></a
                >
              </li>
            </ol>
          </nav>
          <div class="side-card">
            <svg class="icon" aria-hidden="true"><use href="#i-lock" /></svg
            ><strong data-t="side.localTitle"></strong>
            <p data-t="side.localCopy"></p>
          </div>
          <p class="offline-status" id="offline-status" role="status" data-t="offline.localFile"></p>
          <div class="side-footer">
            <button type="button" class="text-button" data-open="sources-dialog">
              <svg class="icon" aria-hidden="true"><use href="#i-info" /></svg><span data-t="customer.sources"></span>
            </button>
            <button type="button" class="text-button" data-open="reset-dialog">
              <svg class="icon" aria-hidden="true"><use href="#i-reset" /></svg><span data-t="customer.newForm"></span>
            </button>
          </div>
        </aside>
        <main class="main">
          <div class="intro">
            <div class="intro-meta">
              <span class="eyebrow" id="customer-eyebrow"></span>
            </div>
            <h1 id="customer-headline"></h1>
            <p id="customer-description"></p>
            <p class="studio-contact" id="customer-studio-contact"></p>
            <div class="intro-bottom">
              <span
                data-t="customer.duration"><svg class="icon" aria-hidden="true"><use href="#i-clock" /></svg></span
              ><span id="overall-label"></span>
            </div>
            <div
              class="overall-track"
              role="progressbar"
              data-t-aria-label="customer.progress"
              aria-valuemin="0"
              aria-valuemax="4"
              aria-valuenow="0"
              id="progress"
            >
              <div class="overall-fill" id="progress-fill"></div>
            </div>
          </div>
          <nav class="mobile-steps" data-t-aria-label="customer.mobileSteps">
            <a href="#personal" data-step="personal" aria-current="step" data-t="customer.mobile.personal"></a
            ><a href="#health" data-step="health" data-t="customer.mobile.health"></a
            ><a href="#consent" data-step="consent" data-t="customer.mobile.consent"></a
            ><a href="#signature" data-step="signature" data-t="customer.mobile.signature"></a>
          </nav>
          <div id="error-summary" class="error-summary" role="alert" tabindex="-1" hidden></div>
          <div id="dependency-error" class="error-summary" role="alert" hidden data-t="customer.libraryMissing">
            <button type="button" id="retry-library" style="text-decoration: underline" data-t-slot="retry" data-t="customer.libraryRetry"></button>
          </div>
          <form id="consent-form" novalidate autocomplete="off">
            <section class="card" id="personal" aria-labelledby="personal-title">
              <div class="card-head">
                <span class="section-number">01</span>
                <div>
                  <h2 id="personal-title" data-t="side.step.personal"></h2>
                  <p data-t="personal.intro"></p>
                </div>
                <span class="section-status" data-status="personal" data-t="status.open"></span>
              </div>
              <div class="card-body">
                <div class="field-grid">
                  <div class="field">
                    <label for="firstName" data-t="personal.firstName"><span class="required">*</span></label
                    ><input
                      id="firstName"
                      name="firstName"
                      autocomplete="off"
                      maxlength="80"
                      data-t-placeholder="personal.firstNamePlaceholder"
                      required
                    />
                  </div>
                  <div class="field">
                    <label for="lastName" data-t="personal.lastName"><span class="required">*</span></label
                    ><input
                      id="lastName"
                      name="lastName"
                      autocomplete="off"
                      maxlength="80"
                      data-t-placeholder="personal.lastNamePlaceholder"
                      required
                    />
                  </div>
                  <div class="field">
                    <label for="birthDate" data-t="personal.birthDate"><span class="required">*</span></label
                    ><input
                      id="birthDate"
                      name="birthDate"
                      type="date"
                      required
                      aria-describedby="age-hint"
                    /><span
                      id="age-hint"
                      style="color: var(--muted); display: block; margin-top: 6px"
                      data-t="personal.ageHint"></span
                    >
                  </div>
                  <div class="field">
                    <label for="phone" data-t="personal.phone"><span class="optional" data-t="common.optional"></span></label
                    ><input
                      id="phone"
                      name="phone"
                      type="tel"
                      inputmode="tel"
                      maxlength="50"
                      data-t-placeholder="personal.phonePlaceholder"
                    />
                  </div>
                  <div class="field full">
                    <label for="street" data-t="personal.street"><span class="optional" data-t="common.optional"></span></label
                    ><input
                      id="street"
                      name="street"
                      maxlength="140"
                      data-t-placeholder="personal.streetPlaceholder"
                    />
                  </div>
                  <div class="address-row full">
                    <div class="field">
                      <label for="postalCode" data-t="personal.postalCode"><span class="optional" data-t="common.optional"></span></label
                      ><input
                        id="postalCode"
                        name="postalCode"
                        inputmode="text"
                        maxlength="16"
                        data-t-placeholder="personal.postalCodePlaceholder"
                      />
                    </div>
                    <div class="field">
                      <label for="city" data-t="personal.city"><span class="optional" data-t="common.optional"></span></label
                      ><input id="city" name="city" maxlength="100" data-t-placeholder="personal.cityPlaceholder" />
                    </div>
                  </div>
                  <div class="field full">
                    <label for="email" data-t="personal.email"><span class="optional" data-t="common.optional"></span></label
                    ><input
                      id="email"
                      name="email"
                      type="email"
                      inputmode="email"
                      autocapitalize="none"
                      spellcheck="false"
                      maxlength="160"
                      data-t-placeholder="personal.emailPlaceholder"
                    />
                  </div>
                </div>
                <div class="field-divider">
                  <h3 data-t="tattoo.title"></h3>
                  <span data-t="tattoo.subtitle"></span>
                </div>
                <div class="field-grid">
                  <div class="field">
                    <label for="appointment" data-t="tattoo.appointment"><span class="required">*</span></label
                    ><input id="appointment" name="appointment" type="date" required />
                  </div>
                  <div class="field">
                    <label for="artist" data-t="tattoo.artist"><span class="required">*</span></label
                    ><input
                      id="artist"
                      name="artist"
                      maxlength="100"
                      data-t-placeholder="tattoo.artistPlaceholder"
                      required
                    />
                  </div>
                  <div class="field">
                    <label for="placement" data-t="tattoo.placement"><span class="required">*</span></label
                    ><input
                      id="placement"
                      name="placement"
                      maxlength="140"
                      data-t-placeholder="tattoo.placementPlaceholder"
                      required
                    />
                  </div>
                  <div class="field">
                    <label for="size" data-t="tattoo.size"><span class="optional" data-t="common.optional"></span></label
                    ><input id="size" name="size" maxlength="80" data-t-placeholder="tattoo.sizePlaceholder" />
                  </div>
                  <div class="field full">
                    <label for="motif" data-t="tattoo.motif"><span class="required">*</span></label
                    ><textarea
                      id="motif"
                      name="motif"
                      rows="2"
                      maxlength="2000"
                      data-t-placeholder="tattoo.motifPlaceholder"
                      required
                    ></textarea>
                  </div>
                  <div class="field">
                    <label for="totalPrice" data-t="tattoo.totalPrice"><span class="optional" data-t="common.optional"></span></label
                    >
                    <input
                      id="totalPrice"
                      name="totalPrice"
                      inputmode="decimal"
                      maxlength="10"
                      data-t-placeholder="tattoo.totalPricePlaceholder"
                      aria-describedby="price-help"
                    />
                  </div>
                  <div class="field">
                    <label for="depositPaid" data-t="tattoo.depositPaid"><span class="optional" data-t="common.optional"></span></label
                    >
                    <input
                      id="depositPaid"
                      name="depositPaid"
                      inputmode="decimal"
                      maxlength="10"
                      data-t-placeholder="tattoo.depositPlaceholder"
                      aria-describedby="price-help"
                    />
                  </div>
                  <p class="price-help full" id="price-help" data-t="tattoo.priceHelp"></p>
                  <p class="price-balance full" id="price-balance" role="status" hidden></p>
                </div>
              </div>
            </section>
            <section class="card" id="health" aria-labelledby="health-title">
              <div class="card-head">
                <span class="section-number">02</span>
                <div>
                  <h2 id="health-title" data-t="health.title"></h2>
                  <p data-t="health.intro"></p>
                </div>
                <span class="section-status" data-status="health" data-t="status.open"></span>
              </div>
              <div class="card-body">
                <div class="callout">
                  <svg class="icon" aria-hidden="true"><use href="#i-info" /></svg
                  ><span data-t="health.callout"></span>
                </div>
                <label class="check-row"
                  ><input type="checkbox" id="sober" name="sober" required /><span
                    class="check-text"
                    ><strong data-t="health.sober"><span class="required">*</span></strong
                    ><small data-t="health.soberText"></small></span
                  ></label
                >
                <div id="medical-questions"></div>
                <div class="callout" id="medical-notice" hidden>
                  <svg class="icon" aria-hidden="true"><use href="#i-info" /></svg
                  ><span data-t="health.yesNotice"></span>
                </div>
                <div class="field" style="margin-top: 20px">
                  <label for="medicationNotes" data-t="health.medication"><span class="optional" data-t="common.optional"></span></label
                  ><textarea
                    id="medicationNotes"
                    name="medicationNotes"
                    rows="2"
                    maxlength="3000"
                    data-t-placeholder="health.medicationPlaceholder"
                  ></textarea>
                </div>
              </div>
            </section>
            <section class="card" id="consent" aria-labelledby="consent-title">
              <div class="card-head">
                <span class="section-number">03</span>
                <div>
                  <h2 id="consent-title" data-t="consent.title"></h2>
                  <p data-t="consent.intro"></p>
                </div>
                <span class="section-status" data-status="consent" data-t="status.open"></span>
              </div>
              <div class="card-body">
                <div class="review" style="margin-bottom: 13px" data-t="consent.reviewNote">
                  <span class="review-label" data-t-slot="label" data-t="common.reviewLabel"
                    ><svg class="icon" aria-hidden="true"><use href="#i-warning" /></svg></span
                  >
                </div>
                <div id="legal-confirmations"></div>
                <fieldset class="photo-box" id="photo-fieldset" style="min-width: 0">
                  <legend class="field-label" style="float: left; width: 100%">
                    <span data-t="consent.photo"></span> <span class="optional" data-t="consent.photoVoluntary"></span>
                  </legend>
                  <div style="clear: both"></div>
                  <span class="inline-review" data-t="common.inlineReview"></span>
                  <p id="photo-text"></p>
                  <div class="photo-options">
                    <label class="choice"
                      ><input
                        type="radio"
                        name="photo"
                        value="yes"
                        required
                        data-t-aria-label="consent.photoYesLabel"
                      /><span data-t="consent.photoYes"></span></label
                    ><label class="choice"
                      ><input
                        type="radio"
                        name="photo"
                        value="no"
                        required
                        data-t-aria-label="consent.photoNoLabel"
                      /><span data-t="consent.photoNo"></span></label
                    >
                  </div>
                  <p class="photo-hint" style="margin: 10px 0 0" data-t="consent.photoHint"></p>
                </fieldset>
                <details class="privacy-details">
                  <summary data-t="consent.privacySummary"></summary>
                  <div class="review">
                    <span class="review-label" data-t="common.reviewLabel"></span>
                    <p id="privacy-text"></p>
                  </div>
                </details>
              </div>
            </section>
            <section class="card" id="signature" aria-labelledby="signature-title">
              <div class="card-head">
                <span class="section-number">04</span>
                <div>
                  <h2 id="signature-title" data-t="signature.title"></h2>
                  <p data-t="signature.intro"></p>
                </div>
                <span class="section-status" data-status="signature" data-t="status.open"></span>
              </div>
              <div class="card-body">
                <p
                  id="signature-confirmation"
                  style="line-height: 1.7; color: var(--muted); margin: 0"
                ></p>
                <div class="signature-tools">
                  <label for="signature-canvas" data-t="signature.label"><span class="required">*</span></label
                  ><button type="button" class="text-button" id="clear-signature" data-t="signature.clear">
                    <svg class="icon" aria-hidden="true"><use href="#i-reset" /></svg>
                  </button>
                </div>
                <div class="canvas-wrap" id="signature-wrap">
                  <div class="canvas-placeholder" id="signature-placeholder">
                    <svg class="icon" aria-hidden="true"><use href="#i-pen" /></svg
                    ><span data-t="signature.placeholder"></span>
                  </div>
                  <div class="sign-baseline"></div>
                  <span class="sign-x">×</span
                  ><canvas
                    id="signature-canvas"
                    tabindex="0"
                    data-t-aria-label="signature.canvasLabel"
                    aria-describedby="signature-help signature-error"
                    data-t="signature.canvasFallback"></canvas
                  >
                </div>
                <div class="signature-meta">
                  <span id="signature-name" data-t="signature.namePlaceholder"></span
                  ><span id="signature-time" data-t="signature.timeAuto"></span>
                </div>
                <p
                  id="signature-help"
                  style="color: var(--muted); line-height: 1.6; margin: 12px 0 0"
                  data-t="signature.help"
                ></p>
                <p class="signature-error" id="signature-error" role="status"></p>
              </div>
            </section>
            <div class="export-footnote" data-t="customer.footnote">
              <svg class="icon" aria-hidden="true"><use href="#i-lock" /></svg>
            </div>
            <div
              class="flex justify-center gap-5 mt-5"
              style="display: flex; justify-content: center; gap: 20px; margin-top: 20px"
            >
              <button type="button" class="text-button" data-open="sources-dialog" data-t="customer.sources"></button
              ><button type="button" class="text-button" data-open="reset-dialog" data-t="customer.newForm"></button>
            </div>
          </form>
        </main>
      </div>
      <footer class="bottom-bar">
        <div class="shell bottom-inner">
          <div class="bottom-info">
            <span class="bottom-doc"

                class="theme-button"
